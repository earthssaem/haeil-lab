<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해일 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- 새로고침 때 1탭이 잠깐 보였다가 바뀌지 않도록, 그리기 전에 주소의 탭(#tab3)을 html[data-tab] 으로 표시 (패널은 css, 탭 버튼은 본문 끝 스크립트, 해제는 common.js 의 setTab) -->
<script>(function () { var m = location.hash.match(/^#tab([2-3])$/); if (m) document.documentElement.setAttribute('data-tab', m[1]); })();</script>
</head>
<body>
<header class="top">
  <a class="brand" id="homeLink" href="#" title="처음 화면으로" aria-label="해일 탐구실 — 처음 화면으로"><h1>해일 탐구실</h1><span class="sub">바닷물은 왜 육지로 밀려들까?</span></a>
</header>
<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="1" role="tab"><span class="num">1</span>폭풍 해일</button>
  <button class="tab" data-tab="2" role="tab"><span class="num">2</span>지진 해일</button>
  <button class="tab" data-tab="3" role="tab"><span class="num">3</span>해일이 오기 전 — 대비 미니게임</button>
</nav>
<main class="wrap">

<!-- ===== 탭1: 폭풍 해일 ===== -->
<section class="panel active" id="panel1">
  <div class="lab-grid">
    <div class="sim">
      <div class="stage-wrap" id="stage1">
        <svg id="svg1" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="badge" id="badge1"></div>
        <div class="mychip" id="chip1"></div>
      </div>
      <div class="controls">
        <button class="btn tog on" id="t1-press" type="button"></button>
        <button class="btn tog on" id="t1-wind" type="button"></button>
        <div class="spacer"></div>
        <button class="btn" id="t1-reset" type="button"></button>
        <button class="btn" id="t1-pause" type="button">⏸ 일시 정지</button>
      </div>
      <div id="ex1"></div>
    </div>
    <div class="lab-side">
      <div class="card">
        <h3 id="t1-h-cond"></h3>
        <div class="rng"><label for="r1-p"><span id="l1-p"></span> <b id="v1-p"></b></label><input type="range" id="r1-p" min="930" max="1013" step="1" value="960"></div>
        <div class="mini-note" id="n1-p"></div>
        <div class="rng"><label for="r1-u"><span id="l1-u"></span> <b id="v1-u"></b></label><input type="range" id="r1-u" min="0" max="40" step="1" value="25"></div>
        <div class="mini-note" id="n1-u"></div>
        <div class="seg-label" id="l1-tide"></div>
        <div class="seg" id="seg1-tide" role="radiogroup"></div>
      </div>
      <div class="card">
        <h3 id="t1-h-sum"></h3>
        <ul class="lvl" id="lvl1"></ul>
        <div class="mini-note" id="n1-flood"></div>
      </div>
      <details class="card fold">
        <summary><h3 id="t1-h-lim"></h3></summary>
        <div class="info" id="t1-lim"></div>
      </details>
    </div>
  </div>
</section>

<!-- ===== 탭2: 지진 해일 ===== -->
<section class="panel" id="panel2">
  <div class="lab-grid">
    <div class="sim">
      <div class="stage-wrap" id="stage2">
        <svg id="svg2" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="badge" id="badge2"></div>
        <div class="mychip" id="chip2"></div>
      </div>
      <div class="controls">
        <button class="btn primary" id="t2-play" type="button"></button>
        <button class="btn" id="t2-restart" type="button"></button>
        <button class="btn" id="t2-prev" type="button"></button>
        <button class="btn" id="t2-next" type="button"></button>
        <div class="spacer"></div>
        <button class="btn tog" id="t2-dots" type="button"></button>
      </div>
      <div id="ex2"></div>
    </div>
    <div class="lab-side">
      <div class="card">
        <h3 id="t2-h-steps"></h3>
        <ol class="stepper" id="st2"></ol>
      </div>
      <div class="card">
        <h3 id="t2-h-speed"></h3>
        <div class="rng"><label for="r2-h"><span id="l2-h"></span> <b id="v2-h"></b></label><input type="range" id="r2-h" min="1000" max="6000" step="250" value="4000"></div>
        <div class="formula" id="f2"></div>
        <div id="sp2"></div>
        <div class="mini-note" id="n2-speed"></div>
      </div>
      <div class="card">
        <h3 id="t2-h-now"></h3>
        <dl class="readout" id="ro2"></dl>
      </div>
      <details class="card fold">
        <summary><h3 id="t2-h-lim"></h3></summary>
        <div class="info" id="t2-lim"></div>
      </details>
    </div>
  </div>
</section>

<!-- ===== 탭3: 해일이 오기 전 — 대비 미니게임 ===== -->
<section class="panel" id="panel3">
  <div class="lab-grid">
    <div class="sim">
      <div class="stage-wrap map" id="stage3">
        <canvas id="cv3" width="960" height="540"></canvas>
        <svg id="svg3" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="badge" id="badge3"></div>
        <div class="mychip" id="chip3"></div>
        <div class="clock" id="clock3" hidden></div>
      </div>
      <ul class="legend" id="leg3"></ul>
      <div id="ex3"></div>
    </div>
    <div class="lab-side">
      <div class="card game">
        <ol class="gsteps" id="gs3"></ol>
        <div id="g3"></div>
      </div>
      <details class="card fold">
        <summary><h3 id="t3-h-src"></h3></summary>
        <div class="info" id="t3-src"></div>
      </details>
    </div>
  </div>
</section>

</main>
<script>/* 주소의 탭 버튼을 처음부터 선택된 모양으로 (위 head 스크립트 참고) */
(function () { var id = document.documentElement.getAttribute('data-tab'); if (!id) return;
  document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === id); });
  document.querySelector('.tab.active').scrollIntoView({ inline: 'center', block: 'nearest' }); })(); // 폰: 탭 줄을 그 탭이 보이게 미리 밀어 둠</script>
<footer class="site-foot">© 2026 제작: 김연경(earthssaem@gmail.com) | <a class="hub" href="https://earthssaem-lab.vercel.app/" target="_blank" rel="noopener">연경쌤의 지구과학 실험실 둘러보기 →</a></footer>
<!-- 스크립트는 common → text → tab1 … tab3 순서로 로드 (번들러·ES module 없이 file:// 에서도 동작) -->
<script src="js/common.js"></script>
<script src="js/text.js"></script>
<script src="js/tab1.js"></script>
<script src="js/tab2.js"></script>
<script src="js/tab3.js"></script>
</body>
</html>
